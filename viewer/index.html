<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kobae — MaleCNS v1.0 live</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <button class="fold" data-fold="left" aria-label="左パネルをたたむ" title="左パネルをたたむ"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M8 2 4 6l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <div class="brand"><span id="title">kobae</span><span id="backend"></span></div>
    <div class="seg" id="modes"><button data-mode="flight" class="on">飛行</button><button data-mode="brain">脳</button></div>
    <div id="transport">
      <button id="pause">一時停止</button>
      <button id="reset">リセット</button>
      <label class="slider">速度 <input id="speed" type="range" min="0" max="6" step="1" value="3"><span id="speedv">1× 実時間</span></label>
    </div>
    <div id="meters">
      <span>脳内時間 <b id="simt">0.00</b> 秒</span>
      <span>実時間の <b id="rt">–</b> 倍</span>
      <span>発火 <b id="sps">0</b> /秒</span>
      <span>描画 <b id="fps">0</b> fps</span>
    </div>
    <button class="fold" data-fold="right" aria-label="右パネルをたたむ" title="右パネルをたたむ"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </header>

  <aside id="left">
    <div class="ph">
      <h2>刺激</h2>
      <label class="slider">強さ <input id="gain" type="range" min="0" max="2" step="0.05" value="1"><span id="gainv">1.00</span>倍</label>
    </div>
    <section>
      <h3>感覚</h3>
      <div class="chips" id="buttons"><button data-toggle="sugar">糖を舐めさせる</button></div>
    </section>
    <section>
      <h3>目に見せるもの</h3>
      <div class="chips" id="visual">
        <button data-visual="off" class="on">なし</button>
        <button data-visual="flash">全体が点滅</button>
        <button data-visual="left">左目だけ明るい</button>
        <button data-visual="right">右目だけ明るい</button>
        <button data-visual="bar">横切る縦棒</button>
        <button data-visual="grating">流れる縞</button>
        <button data-visual="loom">迫ってくる影</button>
        <button data-visual="external">体のカメラ</button>
      </div>
      <canvas id="retina" width="240" height="120"></canvas>
    </section>
    <details class="sec" id="sec-odor">
      <summary><h3>匂い</h3><span class="badge" data-count="#orn"></span><span class="note">糸球体ごと</span></summary>
      <div class="chips code" id="orn"></div>
    </details>
    <section>
      <h3>細胞の種類で指定</h3>
      <input id="glob" placeholder="例: DNa02* / KC*" autocomplete="off" spellcheck="false">
      <div class="row">
        <label class="field">強さ <input id="amp" type="number" value="30" step="5"></label>
        <button id="inject" class="primary">刺激</button>
        <button id="clear">解除</button>
      </div>
      <div id="globinfo" class="note code"></div>
    </section>
  </aside>

  <main id="stage">
    <canvas id="gl"></canvas>
    <div class="seg" id="views"><button data-view="front">正面から</button><button data-view="top">上から</button><button data-view="side">横から</button></div>
    <div id="flight" hidden>
      <canvas id="fly"></canvas>
      <div class="seg" id="flightviews"><button data-fview="chase">追いかけ</button><button data-fview="top">上から</button><button data-fview="side">横から</button><button data-fview="wide">引き</button></div>
      <figure id="eyes"><canvas id="eyesbig" width="128" height="48"></canvas><figcaption>両目に映るもの</figcaption></figure>
      <div id="flighthud"><span id="flightinfo"></span></div>
      <canvas id="minimap" width="220" height="160"></canvas>
    </div>
  </main>

  <aside id="right">
    <section id="brainmini" hidden>
      <div class="sh"><h3>神経系</h3></div>
      <div id="brainminibox"></div>
    </section>
    <section>
      <div class="sh"><h3>行動の出力</h3><span class="note">Hz・左右別</span></div>
      <div class="bars" id="readouts"></div>
    </section>
    <section>
      <div class="sh"><h3>発火の時系列</h3><span class="note" id="rasterinfo"></span></div>
      <canvas id="raster" width="360" height="160"></canvas>
      <div class="note">直近 2 秒・1 行 = 1 細胞</div>
    </section>
    <section>
      <div class="sh"><h3>細胞</h3></div>
      <div id="cellinfo" class="note">点群の細胞をクリックすると詳細がここに出ます。ドラッグで回転、ホイールで拡大。</div>
    </section>
    <details class="sec" id="sec-regions" open>
      <summary><h3>領域ごとの活動</h3><span class="note">Hz / 細胞</span></summary>
      <div class="bars" id="scbars"></div>
    </details>
    <section id="bodysec" hidden>
      <div class="sh"><h3>体</h3></div>
      <img id="bodycam" alt="">
      <canvas id="bodyeyes" width="128" height="48"></canvas>
      <canvas id="bodypath" width="360" height="200"></canvas>
      <div id="bodyinfo" class="note"></div>
    </section>
    <details class="sec" id="sec-legend">
      <summary><h3>点の色</h3><span class="note">細胞のクラス</span></summary>
      <div id="legend"></div>
    </details>
  </aside>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
