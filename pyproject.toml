[project]
name = "kobae"
version = "0.1.0"
description = "Whole-CNS spiking simulation of the MaleCNS v1.0 fruit-fly connectome on Vulkan (wgpu)"
readme = "README.md"
authors = [
    { name = "sksat", email = "sksat@sksat.net" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "numba>=0.67.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "websockets>=17.1",
    "wgpu>=0.32.0",
]

[project.scripts]
kobae = "kobae.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
