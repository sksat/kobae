# TensorFlow is only needed to extract the policy weights (extract_policy.py): uv sync --extra extract
[project]
name = "kobae-body"
version = "0.1.0"
description = "flybody (MuJoCo) fly body + flight policy coupled to the kobae brain server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco>=3.13",
  "dm_control>=1.0.46",
  "numpy",
  "flybody @ file:///home/sksat/prog/kobae/body/vendor/flybody-main",
  "websockets",
  "pillow",
  "mediapy",
  "aiohttp",
  "trimesh",
  "fast-simplification",
]

[project.optional-dependencies]
extract = ["tensorflow-cpu"]
